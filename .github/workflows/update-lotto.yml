name: 로또 최신 회차 자동 업데이트
 
on:
  schedule:
    - cron: '0 14 * * 6'
    - cron: '0 16 * * 0'
  workflow_dispatch:
 
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
 
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: 라이브러리 설치
        run: pip install requests beautifulsoup4
 
      - name: 최신 로또 회차 업데이트
        run: python update_lotto.py
 
      - name: 변경사항 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git diff --quiet || (git add -A && git commit -m "🎰 로또 자동 업데이트 $(date +'%Y-%m-%d')" && git push)

