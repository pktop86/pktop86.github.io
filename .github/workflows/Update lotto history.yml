name: Update Lotto Draw History

permissions:
  contents: write

on:
  schedule:
    # 매주 토요일 21:15 KST = 12:15 UTC
    - cron: '15 12 * * 6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show python version
        run: python --version

      - name: List files
        run: ls -la

      - name: Run update script
        run: python Update_lotto.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add draw-history-261-latest.json
          git diff --staged --quiet || git commit -m "auto: update lotto draw history $(date +'%Y-%m-%d')"
          git push
