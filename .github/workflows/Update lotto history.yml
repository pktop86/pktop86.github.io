name: Update Lotto Draw History

permissions:
  contents: write

on:
  schedule:
    - cron: '15 12 * * 6'  # 토 21:15 KST
    - cron: '25 12 * * 6'  # 토 21:25 KST
    - cron: '45 12 * * 6'  # 토 21:45 KST
    - cron: '0 13 * * 6'   # 토 22:00 KST
    - cron: '55 14 * * 6'   # 토 23:55 KST
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show python version
        run: python --version

      - name: List files
        run: ls -la

      - name: Run update script
        run: python Update_lotto.py

      - name: Show latest json tail
        run: |
          python - << 'PY'
          import json
          with open('draw-history-261-latest.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          print("count:", len(data))
          print("last:", data[-1] if data else None)
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add draw-history-261-latest.json
          git diff --staged --quiet || git commit -m "auto: update lotto draw history $(date +'%Y-%m-%d %H:%M')"
          git push
