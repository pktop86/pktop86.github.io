name: Update Lotto Draw History
 
permissions:
  contents: write
 
on:
  schedule:
    # UTC → KST (+9) / 추첨 20:35 이후 여유 있게
    - cron: "15 12 * * 6"   # KST 토 21:15
    - cron: "35 12 * * 6"   # KST 토 21:35
    - cron: "0 13 * * 6"    # KST 토 22:00
  workflow_dispatch:
 
jobs:
  update:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Run update script
        run: python Update_lotto.py
 
      - name: Show result
        run: |
          python - << 'PY'
          import json
          with open('draw-history-261-latest.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          print("총 회차:", len(data))
          print("최신:", data[-1] if data else None)
          PY
 
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add draw-history-261-latest.json
          git diff --staged --quiet || git commit -m "auto: lotto history $(date +'%Y-%m-%d %H:%M KST')"
          git push
 
