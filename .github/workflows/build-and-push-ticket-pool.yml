name: Build and Push Ticket Pool

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "10 15 * * 6"   # KST 일요일 00:10

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests firebase-admin

      - name: Restore Firebase service account
        run: |
          cat <<'EOF' > firebase-service-account.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EOF

      - name: Show files before build
        run: |
          pwd
          ls -la
          ls -la scripts || true

      - name: Build ticket pools
        run: |
          python scripts/build_ticket_pool.py

      - name: Show generated pools
        run: |
          ls -la generated_pools
          python - << 'PY'
          import glob, json
          files = sorted(glob.glob("generated_pools/pool_*.json"))
          print("generated files:", files)
          for f in files:
              with open(f, "r", encoding="utf-8") as fp:
                  data = json.load(fp)
              meta = data.get("meta", {})
              items = data.get("items", [])
              print(f, "round=", meta.get("round"), "count=", meta.get("count"), "items=", len(items))
          PY

      - name: Push pools to Firestore
        run: |
          python scripts/push_ticket_pool_to_firestore.py
